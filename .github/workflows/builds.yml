name: FatePlanner Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Upgrade packaging tools
        run: >
          python -m pip install
          --upgrade
          pip setuptools wheel

      - name: Install FatePlanner
        run: >
          python -m pip install
          -e ".[dev,build]"

      - name: Run tests
        run: python -m pytest -v

      - name: Build FatePlanner
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            packaging/linux/FatePlanner.spec

      - name: Create Linux archive
        run: |
          cd dist
          tar \
            -czf \
            FatePlanner-Linux-x86_64.tar.gz \
            FatePlanner

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FatePlanner-Linux-x86_64
          path: dist/FatePlanner-Linux-x86_64.tar.gz
          if-no-files-found: error


  windows:
    name: Windows x86_64
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: >
          python -m pip install
          --upgrade
          pip setuptools wheel

      - name: Install FatePlanner
        run: >
          python -m pip install
          -e ".[dev,build]"

      - name: Generate Windows icon
        run: >
          python packaging/windows/make_icon.py

      - name: Run tests
        run: python -m pytest -v

      - name: Build FatePlanner
        run: >
          python -m PyInstaller
          --clean
          --noconfirm
          packaging/windows/FatePlanner.spec

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\FatePlanner\*" `
            -DestinationPath "dist\FatePlanner-Windows-Portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup `
            --yes `
            --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          Write-Host "Using Inno Setup:"
          Write-Host $iscc

          & $iscc `
            "packaging\windows\FatePlanner.iss"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = `
            "dist\installer\FatePlanner-Windows-Setup-v0.1.0.exe"

          if (-not (Test-Path $installer)) {
            throw "Windows installer was not created."
          }

          Get-Item $installer |
            Format-List Name, Length, FullName

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: FatePlanner-Windows-Portable
          path: dist/FatePlanner-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FatePlanner-Windows-Setup
          path: dist/installer/FatePlanner-Windows-Setup-v0.1.0.exe
          if-no-files-found: error