[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "FatePlanner"
version = "0.1.0"
description = "An offline Persian productivity, study, habit and finance planner."
requires-python = ">=3.11"

dependencies = [
    "PySide6",
    "jdatetime>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

build = [
    "pyinstaller>=6.10,<7",
    "Pillow>=10,<12",
]

[project.scripts]
fateplanner = "fateplanner.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]